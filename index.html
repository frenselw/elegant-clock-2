<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegant Clock</title>
    <style>
        /*
         * Copyright (c) 2025 Hang Wong
         * SPDX-License-Identifier: AGPL-3.0-or-later
         */
        :root {
            --bg-dark: #1C2533;
            --face-dark: #2C3E50;
            --text-dark: #EAEAEA;
            --hand-dark: #EAEAEA;
            --second-hand-dark: #FF4B5C;
            --pivot-dark: #FF4B5C;
            --btn-bg-dark: rgba(255, 255, 255, 0.1);
            --btn-icon-dark: #FFFFFF;

            --bg-light: #F0F0F0;
            --face-light: #FFFFFF;
            --text-light: #222222;
            --hand-light: #222222;
            --second-hand-light: #FF0000;
            --pivot-light: #FF0000;
            --btn-bg-light: rgba(0, 0, 0, 0.08);
            --btn-icon-light: #333333;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.5s;
            background-color: var(--bg-dark);
            overflow: hidden;
        }

        body.light-mode {
            background-color: var(--bg-light);
        }

        .clock-container {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 3vmin;
        }

        .clock {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .analog-clock {
            width: 80vmin;
            height: 80vmin;
            background-color: var(--face-dark);
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            transition: background-color 0.5s;
        }
        
        body.light-mode .analog-clock {
            background-color: var(--face-light);
        }
        
        .digital-clock {
            font-size: 25vmin;
            font-weight: 600;
            display: none;
            color: var(--text-dark);
            min-width: 11ch;
            justify-content: center;
            text-align: center;
            white-space: nowrap;
            font-variant-numeric: tabular-nums lining-nums;
            font-feature-settings: 'tnum' 1, 'lnum' 1;
        }
        
        body.light-mode .digital-clock {
            color: var(--text-light);
        }

        .info-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 1.5vmin;
        }

        .date-display,
        .zone-display {
            padding: 0.9em 1.4em;
            border-radius: 999px;
            background: var(--btn-bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: var(--text-dark);
            font-size: clamp(14px, 2.6vmin, 24px);
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            line-height: 1.2;
            text-align: center;
            transition: color 0.5s, background-color 0.5s, border-color 0.5s;
        }

        body.light-mode .date-display,
        body.light-mode .zone-display {
            background: var(--btn-bg-light);
            border: 1px solid rgba(0, 0, 0, 0.05);
            color: var(--text-light);
        }

        .analog-clock::after {
            content: '';
            position: absolute;
            width: 2.5vmin;
            height: 2.5vmin;
            background: var(--pivot-dark);
            border-radius: 50%;
            z-index: 11;
        }

        body.light-mode .analog-clock::after {
            background: var(--pivot-light);
        }

        .number {
            position: absolute;
            font-size: 7vmin;
            font-weight: 500;
            color: var(--text-dark);
            transform: translate(-50%, -50%);
            transition: color 0.5s;
        }
        
        body.light-mode .number {
            color: var(--text-light);
        }
        
        .hand {
            position: absolute;
            bottom: 50%;
            transform-origin: bottom;
            border-radius: 10px;
        }

        .hour-hand, .minute-hand {
            background: var(--hand-dark);
            transition: background 0.5s;
        }
        .hour-hand { width: 1.8vmin; height: 25%; z-index: 8; }
        .minute-hand { width: 1.4vmin; height: 35%; z-index: 9; }
        
        body.light-mode .hour-hand,
        body.light-mode .minute-hand { background: var(--hand-light); }

        .second-hand {
            width: 0.5vmin; height: 40%;
            background: var(--second-hand-dark);
            z-index: 10;
        }
        body.light-mode .second-hand { background: var(--second-hand-light); }

        .controls {
            position: fixed;
            top: 50%;
            right: 3vw;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 100;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.4s ease-in-out, visibility 0.4s ease-in-out;
        }
        
        .controls.hidden {
            opacity: 0;
            visibility: hidden;
        }

        button {
            width: 50px;
            height: 50px;
            background: var(--btn-bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: transform 0.2s ease, background-color 0.3s;
        }

        button:hover {
            transform: scale(1.1);
        }

        body.light-mode button {
            background: var(--btn-bg-light);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        button svg {
            width: 24px;
            height: 24px;
            fill: var(--btn-icon-dark);
            transition: fill 0.3s;
        }

        .format-toggle-btn {
            color: var(--btn-icon-dark);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: color 0.3s, background-color 0.3s, transform 0.2s ease;
        }
        
        body.light-mode button svg {
            fill: var(--btn-icon-light);
        }

        body.light-mode .format-toggle-btn {
            color: var(--btn-icon-light);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background: var(--face-dark);
            color: var(--text-dark);
            padding: 25px 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        body.light-mode .modal-content {
            background: var(--face-light);
            color: var(--text-light);
        }

        .modal-content h2 {
            margin-top: 0;
        }

        .modal-content a {
            color: var(--second-hand-dark);
        }

        body.light-mode .modal-content a {
            color: var(--second-hand-light);
        }

        button svg.stroke-icon {
            fill: none;
            stroke: var(--btn-icon-dark);
            stroke-width: 1.8;
            stroke-linecap: round;
            transition: stroke 0.3s;
        }

        body.light-mode button svg.stroke-icon {
            stroke: var(--btn-icon-light);
        }

        .region-modal-content {
            max-width: 620px;
            max-height: 88vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-hint {
            margin: 0.4em 0 0;
            font-size: 0.85rem;
            opacity: 0.75;
        }

        .region-list {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
            gap: 10px;
            margin-top: 18px;
            padding: 2px;
            overflow-y: auto;
        }

        .region-option {
            width: auto;
            height: auto;
            min-height: 54px;
            border-radius: 12px;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 3px;
            padding: 8px 12px;
            color: var(--text-dark);
            text-align: left;
        }

        .region-option:hover {
            transform: none;
            background: rgba(255, 255, 255, 0.18);
        }

        .region-option[aria-pressed="true"] {
            box-shadow: inset 0 0 0 2px var(--second-hand-dark);
        }

        .region-option-name {
            font-size: 0.88rem;
            font-weight: 600;
        }

        .region-option-offset {
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            opacity: 0.72;
        }

        body.light-mode .region-option {
            color: var(--text-light);
        }

        body.light-mode .region-option:hover {
            background: rgba(0, 0, 0, 0.12);
        }

        body.light-mode .region-option[aria-pressed="true"] {
            box-shadow: inset 0 0 0 2px var(--second-hand-light);
        }

    </style>
</head>
<body>

    <div class="clock-container">
        <div class="clock analog-clock">
            <div class="hand hour-hand"></div>
            <div class="hand minute-hand"></div>
            <div class="hand second-hand"></div>
        </div>
        <div class="clock digital-clock"></div>
        <div class="info-row" aria-live="polite">
            <div class="date-display"></div>
            <div class="zone-display"></div>
        </div>
    </div>

    <div class="controls">
        <button id="toggleClockBtn" title="Toggle Clock"></button>
        <button id="toggleFormatBtn" class="format-toggle-btn" type="button"></button>
        <button id="toggleDateBtn" title="Hide Date"></button>
        <button id="toggleZoneBtn" type="button" title="Select Region"></button>
        <button id="fullscreenBtn" title="Toggle Fullscreen"></button>
        <button id="toggleModeBtn" title="Toggle Theme"></button>
        <button id="aboutBtn" title="About"></button>
    </div>

    <div id="aboutModal" class="modal-overlay">
        <div class="modal-content">
            <h2>Elegant Clock</h2>
            <p>Created by <strong>Hang Wong</strong></p>
            <p>
                This software is open-source, licensed under the 
                <a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener noreferrer">GNU AGPLv3</a>.
            </p>
        </div>
    </div>

    <div id="regionModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="regionModalTitle">
        <div class="modal-content region-modal-content">
            <h2 id="regionModalTitle">Select Region</h2>
            <p class="modal-hint">Clock, digits and date all follow the chosen region.</p>
            <div class="region-list" id="regionList"></div>
        </div>
    </div>


    <script>
        /*
         * Copyright (c) 2025 Hang Wong
         * SPDX-License-Identifier: AGPL-3.0-or-later
         */
        const digitalClock = document.querySelector('.digital-clock');
        const analogClock = document.querySelector('.analog-clock');
        const dateDisplay = document.querySelector('.date-display');
        const zoneDisplay = document.querySelector('.zone-display');
        const hourHand = document.querySelector('.hour-hand');
        const minuteHand = document.querySelector('.minute-hand');
        const secondHand = document.querySelector('.second-hand');
        const controls = document.querySelector('.controls');
        const toggleClockBtn = document.getElementById('toggleClockBtn');
        const toggleFormatBtn = document.getElementById('toggleFormatBtn');
        const toggleDateBtn = document.getElementById('toggleDateBtn');
        const toggleZoneBtn = document.getElementById('toggleZoneBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const toggleModeBtn = document.getElementById('toggleModeBtn');
        const aboutBtn = document.getElementById('aboutBtn');
        const aboutModal = document.getElementById('aboutModal');
        const regionModal = document.getElementById('regionModal');
        const regionList = document.getElementById('regionList');
        const timeFormatStorageKey = 'elegant-clock-time-format';
        const zoneStorageKey = 'elegant-clock-time-zone';
        const systemTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';

        let dateFormatter = null;
        let wallClockFormatter = null;
        let selectedRegion = loadRegionPreference();
        let isAnalog = true;
        let isDateVisible = true;
        let is24Hour = loadTimeFormatPreference();

        const icons = {
            analog: `<svg viewBox="0 0 24 24"><path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z"></path><path d="M13 7h-2v5.414l3.293 3.293 1.414-1.414L13 11.586z"></path></svg>`,
            digital: `<svg viewBox="0 0 24 24"><path d="M7 10h2v4H7zm4 0h2v4h-2zm4 0h2v4h-2z"></path><path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z"></path></svg>`,
            dateVisible: `<svg viewBox="0 0 24 24"><path d="M7 2h2v2h6V2h2v2h3v18H4V4h3zm11 8H6v10h12V10zm0-4H6v2h12V6z"></path></svg>`,
            dateHidden: `<svg viewBox="0 0 24 24"><path d="M7 2h2v2h6V2h2v2h3v18H4V4h3zm11 8H6v10h12V10zm0-4H6v2h12V6z"></path><path d="M5.707 4.293 19.707 18.293l-1.414 1.414-14-14z"></path></svg>`,
            fullscreenEnter: `<svg viewBox="0 0 24 24"><path d="M5 5h5V3H3v7h2zm5 14H5v-5H3v7h7zm9-14h-5V3h7v7h-2zm-5 14h5v-5h2v7h-7z"></path></svg>`,
            fullscreenExit: `<svg viewBox="0 0 24 24"><path d="M3 9h2V5h4V3H3zm16 0h2V5h-4V3h6v6zM9 21h2v-4h4v-2H9zm12-6h-2v4h-4v2h6z"></path></svg>`,
            sun: `<svg viewBox="0 0 24 24"><path d="M12 2c5.514 0 10 4.486 10 10s-4.486 10-10 10S2 17.514 2 12 6.486 2 12 2zM4 12c0 1.846.634 3.543 1.688 4.898l8.414-8.414A7.962 7.962 0 0 0 12 4c-4.411 0-8 3.589-8 8zm8 8c1.846 0 3.543-.634 4.898-1.688l-8.414-8.414A7.962 7.962 0 0 0 4 12c0 4.411 3.589 8 8 8z"></path></svg>`,
            moon: `<svg viewBox="0 0 24 24"><path d="M12 20a8 8 0 1 1 8-8 8.009 8.009 0 0 1-8 8zm0-18A10 10 0 1 0 22 12 10 10 0 0 0 12 2z"></path></svg>`,
            globe: `<svg class="stroke-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><ellipse cx="12" cy="12" rx="4" ry="9"></ellipse><path d="M3 12h18"></path><path d="M5.5 7.5h13M5.5 16.5h13"></path></svg>`,
            info: `<svg viewBox="0 0 24 24"><path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z"></path><path d="M11 11h2v6h-2zm0-4h2v2h-2z"></path></svg>`
        };

        const regions = [
            { id: 'system', name: 'System' },
            { id: 'Pacific/Honolulu', name: 'Honolulu' },
            { id: 'America/Anchorage', name: 'Anchorage' },
            { id: 'America/Los_Angeles', name: 'Los Angeles' },
            { id: 'America/Denver', name: 'Denver' },
            { id: 'America/Chicago', name: 'Chicago' },
            { id: 'America/New_York', name: 'New York' },
            { id: 'America/Mexico_City', name: 'Mexico City' },
            { id: 'America/Sao_Paulo', name: 'São Paulo' },
            { id: 'UTC', name: 'UTC' },
            { id: 'Europe/London', name: 'London' },
            { id: 'Europe/Dublin', name: 'Dublin' },
            { id: 'Europe/Lisbon', name: 'Lisbon' },
            { id: 'Europe/Madrid', name: 'Madrid' },
            { id: 'Europe/Paris', name: 'Paris' },
            { id: 'Europe/Berlin', name: 'Berlin' },
            { id: 'Europe/Rome', name: 'Rome' },
            { id: 'Europe/Amsterdam', name: 'Amsterdam' },
            { id: 'Europe/Stockholm', name: 'Stockholm' },
            { id: 'Europe/Prague', name: 'Prague' },
            { id: 'Europe/Warsaw', name: 'Warsaw' },
            { id: 'Europe/Athens', name: 'Athens' },
            { id: 'Europe/Istanbul', name: 'Istanbul' },
            { id: 'Europe/Moscow', name: 'Moscow' },
            { id: 'Africa/Lagos', name: 'Lagos' },
            { id: 'Africa/Cairo', name: 'Cairo' },
            { id: 'Africa/Johannesburg', name: 'Johannesburg' },
            { id: 'Asia/Jerusalem', name: 'Jerusalem' },
            { id: 'Asia/Dubai', name: 'Dubai' },
            { id: 'Asia/Karachi', name: 'Karachi' },
            { id: 'Asia/Kolkata', name: 'Kolkata' },
            { id: 'Asia/Kathmandu', name: 'Kathmandu' },
            { id: 'Asia/Dhaka', name: 'Dhaka' },
            { id: 'Asia/Bangkok', name: 'Bangkok' },
            { id: 'Asia/Jakarta', name: 'Jakarta' },
            { id: 'Asia/Shanghai', name: 'Shanghai' },
            { id: 'Asia/Hong_Kong', name: 'Hong Kong' },
            { id: 'Asia/Taipei', name: 'Taipei' },
            { id: 'Asia/Singapore', name: 'Singapore' },
            { id: 'Asia/Kuala_Lumpur', name: 'Kuala Lumpur' },
            { id: 'Asia/Manila', name: 'Manila' },
            { id: 'Asia/Seoul', name: 'Seoul' },
            { id: 'Asia/Tokyo', name: 'Tokyo' },
            { id: 'Australia/Perth', name: 'Perth' },
            { id: 'Australia/Sydney', name: 'Sydney' },
            { id: 'Australia/Brisbane', name: 'Brisbane' },
            { id: 'Pacific/Auckland', name: 'Auckland' }
        ];

        function loadTimeFormatPreference() {
            try {
                return localStorage.getItem(timeFormatStorageKey) !== '12';
            } catch {
                return true;
            }
        }

        function saveTimeFormatPreference() {
            try {
                localStorage.setItem(timeFormatStorageKey, is24Hour ? '24' : '12');
            } catch {
                // Ignore storage failures and fall back to in-memory state.
            }
        }

        function isValidTimeZone(timeZone) {
            try {
                new Intl.DateTimeFormat('en-US', { timeZone });
                return true;
            } catch {
                return false;
            }
        }

        function loadRegionPreference() {
            try {
                const saved = localStorage.getItem(zoneStorageKey);
                return saved && saved !== 'system' && isValidTimeZone(saved) ? saved : 'system';
            } catch {
                return 'system';
            }
        }

        function saveRegionPreference() {
            try {
                localStorage.setItem(zoneStorageKey, selectedRegion);
            } catch {
                // Ignore storage failures and fall back to in-memory state.
            }
        }

        function activeTimeZone() {
            return selectedRegion === 'system' ? systemTimeZone : selectedRegion;
        }

        function regionDisplayName() {
            if (selectedRegion !== 'system') {
                const match = regions.find(region => region.id === selectedRegion);
                return match ? match.name : selectedRegion;
            }
            return systemRegionName();
        }

        function createWallClockFormatter(timeZone) {
            return new Intl.DateTimeFormat('en-US', {
                timeZone,
                hourCycle: 'h23',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        function zoneOffsetMs(now, formatter) {
            const parts = {};
            formatter.formatToParts(now).forEach(({ type, value }) => {
                if (type !== 'literal') parts[type] = value;
            });
            const wallClockAsUTC = Date.UTC(
                Number(parts.year),
                Number(parts.month) - 1,
                Number(parts.day),
                Number(parts.hour),
                Number(parts.minute),
                Number(parts.second)
            );
            return wallClockAsUTC - (now.getTime() - now.getMilliseconds());
        }

        function wallClock(now, offsetMs) {
            const shifted = new Date(now.getTime() + offsetMs);
            return {
                hours: shifted.getUTCHours(),
                minutes: shifted.getUTCMinutes(),
                seconds: shifted.getUTCSeconds()
            };
        }

        function formatUtcOffset(offsetMs) {
            const totalMinutes = Math.round(offsetMs / 60000);
            const sign = totalMinutes < 0 ? '-' : '+';
            const absolute = Math.abs(totalMinutes);
            const hours = Math.floor(absolute / 60);
            const minutes = absolute % 60;
            return minutes
                ? `UTC${sign}${hours}:${String(minutes).padStart(2, '0')}`
                : `UTC${sign}${hours}`;
        }

        function applyRegion() {
            const timeZone = activeTimeZone();
            wallClockFormatter = createWallClockFormatter(timeZone);
            dateFormatter = new Intl.DateTimeFormat(navigator.language, {
                timeZone,
                weekday: 'short',
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });
        }

        function formatDigitalTime(clock) {
            const minutes = String(clock.minutes).padStart(2, '0');
            const seconds = String(clock.seconds).padStart(2, '0');

            if (is24Hour) {
                const hours = String(clock.hours).padStart(2, '0');
                return `${hours}:${minutes}:${seconds}`;
            }

            const meridiem = clock.hours >= 12 ? 'PM' : 'AM';
            const displayHour = clock.hours % 12 || 12;

            return `${displayHour}:${minutes}:${seconds} ${meridiem}`;
        }

        function updateTimeFormatButton() {
            const currentLabel = is24Hour ? '24H' : '12H';
            const nextLabel = is24Hour ? '12-hour' : '24-hour';

            toggleFormatBtn.textContent = currentLabel;
            toggleFormatBtn.title = `Switch digital clock to ${nextLabel} format`;
            toggleFormatBtn.setAttribute(
                'aria-label',
                `Digital clock is using ${is24Hour ? '24-hour' : '12-hour'} time. Activate to switch to ${nextLabel} format.`
            );
            toggleFormatBtn.setAttribute('aria-pressed', String(is24Hour));
        }
        
        function setDate() {
            const now = new Date();
            const offsetMs = zoneOffsetMs(now, wallClockFormatter);
            const clock = wallClock(now, offsetMs);

            const secondsDegrees = (clock.seconds / 60) * 360;
            secondHand.style.transform = `rotate(${secondsDegrees}deg)`;
            const minutesDegrees = (clock.minutes / 60) * 360 + (clock.seconds/60)*6;
            minuteHand.style.transform = `rotate(${minutesDegrees}deg)`;
            const hoursDegrees = (clock.hours / 12) * 360 + (clock.minutes/60)*30;
            hourHand.style.transform = `rotate(${hoursDegrees}deg)`;

            digitalClock.textContent = formatDigitalTime(clock);
            dateDisplay.textContent = dateFormatter.format(now);
            zoneDisplay.textContent = `${regionDisplayName()} · ${formatUtcOffset(offsetMs)}`;
        }

        function toggleClocks() {
            isAnalog = !isAnalog;
            analogClock.style.display = isAnalog ? 'flex' : 'none';
            digitalClock.style.display = isAnalog ? 'none' : 'flex';
            toggleClockBtn.innerHTML = isAnalog ? icons.digital : icons.analog;
        }

        function updateDateVisibilityButton() {
            toggleDateBtn.innerHTML = isDateVisible ? icons.dateVisible : icons.dateHidden;
            toggleDateBtn.title = isDateVisible ? 'Hide Date' : 'Show Date';
            toggleDateBtn.setAttribute('aria-label', toggleDateBtn.title);
        }

        function toggleDateVisibility() {
            isDateVisible = !isDateVisible;
            dateDisplay.hidden = !isDateVisible;
            updateDateVisibilityButton();
        }

        function toggleTimeFormat() {
            is24Hour = !is24Hour;
            saveTimeFormatPreference();
            updateTimeFormatButton();
            setDate();
        }

        function systemRegionName() {
            return systemTimeZone.split('/').pop().replace(/_/g, ' ');
        }

        function availableRegions() {
            return regions.filter(region => region.id === 'system' || isValidTimeZone(region.id));
        }

        function renderRegionList() {
            const now = new Date();
            const entries = availableRegions()
                .map(region => ({
                    region,
                    offsetMs: zoneOffsetMs(
                        now,
                        createWallClockFormatter(region.id === 'system' ? systemTimeZone : region.id)
                    )
                }))
                .sort((a, b) => a.offsetMs - b.offsetMs);

            regionList.textContent = '';

            entries.forEach(({ region, offsetMs }) => {
                const option = document.createElement('button');
                option.type = 'button';
                option.className = 'region-option';
                option.setAttribute('aria-pressed', String(region.id === selectedRegion));

                const name = document.createElement('span');
                name.className = 'region-option-name';
                name.textContent = region.id === 'system' ? `System (${systemRegionName()})` : region.name;

                const offset = document.createElement('span');
                offset.className = 'region-option-offset';
                offset.textContent = formatUtcOffset(offsetMs);

                option.append(name, offset);
                option.addEventListener('click', () => selectRegion(region.id));
                regionList.appendChild(option);
            });
        }

        function openRegionModal() {
            renderRegionList();
            regionModal.style.display = 'flex';
        }

        function closeRegionModal() {
            regionModal.style.display = 'none';
        }

        function updateRegionButton() {
            const label = `Select region. Current region: ${regionDisplayName()}`;
            toggleZoneBtn.title = label;
            toggleZoneBtn.setAttribute('aria-label', label);
        }

        function selectRegion(id) {
            selectedRegion = id;
            saveRegionPreference();
            applyRegion();
            setDate();
            updateRegionButton();
            closeRegionModal();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Could not enter full-screen mode: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }
        
        function handleFullscreenChange() {
            const isFullscreen = !!document.fullscreenElement;
            controls.classList.toggle('hidden', isFullscreen);
            fullscreenBtn.innerHTML = isFullscreen ? icons.fullscreenExit : icons.fullscreenEnter;
        }

        function toggleMode() {
            document.body.classList.toggle('light-mode');
            const isLightMode = document.body.classList.contains('light-mode');
            toggleModeBtn.innerHTML = isLightMode ? icons.moon : icons.sun;
        }

        function createClockFace() {
            const radius = 42; 
            for (let i = 1; i <= 12; i++) {
                const angle = i * 30 * (Math.PI / 180);
                const number = document.createElement('div');
                number.className = 'number';
                number.textContent = i;
                number.style.left = `${50 + radius * Math.sin(angle)}%`;
                number.style.top = `${50 - radius * Math.cos(angle)}%`;
                analogClock.appendChild(number);
            }
        }

        function init() {
            createClockFace();
            applyRegion();
            setInterval(setDate, 1000);
            setDate();
            
            toggleClockBtn.innerHTML = icons.digital;
            toggleZoneBtn.innerHTML = icons.globe;
            updateRegionButton();
            updateTimeFormatButton();
            updateDateVisibilityButton();
            fullscreenBtn.innerHTML = icons.fullscreenEnter;
            toggleModeBtn.innerHTML = icons.sun;
            aboutBtn.innerHTML = icons.info;

            analogClock.style.display = 'flex';
            digitalClock.style.display = 'none';

            toggleClockBtn.addEventListener('click', toggleClocks);
            toggleFormatBtn.addEventListener('click', toggleTimeFormat);
            toggleDateBtn.addEventListener('click', toggleDateVisibility);
            fullscreenBtn.addEventListener('click', toggleFullscreen);
            toggleModeBtn.addEventListener('click', toggleMode);
            document.addEventListener('fullscreenchange', handleFullscreenChange);
            aboutBtn.addEventListener('click', () => { aboutModal.style.display = 'flex'; });
            aboutModal.addEventListener('click', (e) => {
                if (e.target === aboutModal) {
                    aboutModal.style.display = 'none';
                }
            });

            toggleZoneBtn.addEventListener('click', openRegionModal);
            regionModal.addEventListener('click', (e) => {
                if (e.target === regionModal) {
                    closeRegionModal();
                }
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeRegionModal();
                }
            });
        }

        init();

    </script>
</body>
</html>
